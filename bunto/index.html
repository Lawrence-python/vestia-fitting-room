<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F9F2E9">
<meta name="description" content="Premium organic-cotton basics for ages 1–6: rompers, dungarees, tees, cardigans and hats in soft peach, pink, sage and butter.">
<title>BUNTO° — Soft things for small people</title>
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&amp;display=swap">
<style>
:root {
  --sheet: url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261113_115509_577e7e29-0e80-43e6-93ac-e6cf71972818.png&w=3200&q=85");
  --bg:#F9F2E9; --ghost:#F5E6D9; --ink:#3E3A3C; --muted:#716D71; --line:#E6D9D2; --dot:#CFC6C2;
  --n:calc(100vw / 1440); --u:min(calc(100vw / 1440), calc(100vh / 900));
  font-family:Inter,system-ui,sans-serif; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
button,a{color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;padding:0;cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
svg{display:block;fill:none;stroke:currentColor}
.filters,.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.caps{font-size:max(9px,calc(10.5 * var(--n)));font-weight:500;letter-spacing:.32em;text-transform:uppercase;line-height:1.62}
.chrome{position:absolute;z-index:400}
.logo{left:calc(46 * var(--n));top:calc(30 * var(--n));font-size:max(22px,calc(30 * var(--n)));font-weight:700;letter-spacing:-.035em;line-height:1}
.logo sup{font-size:.5em;font-weight:500;vertical-align:.9em;margin-left:.04em;line-height:0}
.tagline{top:calc(37 * var(--n));left:50%;transform:translateX(-50%);padding-left:.32em;text-align:center;white-space:nowrap}
.nav{right:calc(39 * var(--n));top:calc(32 * var(--n));display:flex;align-items:center;gap:calc(16 * var(--n))}
.nav .caps{font-size:max(9px,calc(9.5 * var(--n)))}
.round{position:relative;width:max(28px,calc(35 * var(--n)));aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:border-color .2s}
.round:hover{border-color:var(--ink)}
.round svg{width:42%;stroke-width:1.3}
#badge{position:absolute;top:-5px;right:-6px;background:var(--ink);color:var(--bg);min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center;border-radius:20px;font-size:9px;font-weight:600}
#badge[hidden]{display:none}
.series{left:calc(46 * var(--n));top:calc(131 * var(--n))}
.fabric{right:calc(38 * var(--n));top:calc(132 * var(--n));text-align:right}
.vertical{left:calc(26 * var(--n));top:calc(447 * var(--n));width:0;display:flex;justify-content:center;white-space:nowrap;transform:translateY(-50%) rotate(-90deg);font-size:max(8px,calc(9 * var(--n)));pointer-events:none}
.index{left:calc(46 * var(--n));bottom:calc(52 * var(--n));display:flex;align-items:center;pointer-events:none}
.digits{height:1em;overflow:hidden;font-size:max(30px,calc(50 * var(--n)));line-height:1;font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.digits span{display:block}
.index i{height:calc(28 * var(--n));width:1px;background:var(--ink);opacity:.45;margin:0 calc(20 * var(--n))}
.labels{position:relative;min-width:16em;font-size:max(8px,calc(9.5 * var(--n)))}
.labels span{display:block;transition:opacity .45s ease, transform .45s ease}
.labels .alternate{position:absolute;inset:0;opacity:0;transform:translateY(8px)}
.detail .labels .normal{opacity:0;transform:translateY(-8px)}
.detail .labels .alternate{opacity:1;transform:none}
.hint{left:50%;bottom:calc(59 * var(--n));transform:translateX(-50%);display:flex;align-items:center;gap:calc(14 * var(--n));font-size:max(8px,calc(9.5 * var(--n)));white-space:nowrap}
.hint svg{width:max(8px,calc(11 * var(--n)));stroke-width:1.2}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(1440 * var(--u));height:calc(900 * var(--u));touch-action:none;user-select:none}
.ghost{position:absolute;width:100%;top:calc(109 * var(--u));margin:0;text-align:center;font-size:calc(295 * var(--u));font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ghost);pointer-events:none}
.shadow{position:absolute;left:calc(370 * var(--u));top:calc(690 * var(--u));width:calc(700 * var(--u));height:calc(48 * var(--u));border-radius:50%;background:radial-gradient(ellipse,rgba(120,96,86,.16),rgba(120,96,86,.07) 55%,transparent 72%);filter:blur(calc(3 * var(--u)));transition:opacity .5s}
.dots{position:absolute;left:50%;top:calc(752 * var(--u));display:flex;align-items:center;gap:calc(12 * var(--u));transform:translate(-50%,-50%)}
.dots i{width:max(6px,calc(9 * var(--u)));aspect-ratio:1;border-radius:50%;background:var(--dot);transition:background-color .5s}
.dots i.current{background:var(--ink)}
#ring{position:absolute;inset:0;touch-action:none}
.item{position:absolute;left:0;top:0;width:var(--piece,calc(510 * var(--u)));height:var(--piece,calc(510 * var(--u)));margin:calc(-.5 * var(--piece,calc(510 * var(--u)))) 0 0 calc(-.5 * var(--piece,calc(510 * var(--u))));transform-origin:center;cursor:pointer;will-change:transform;outline-offset:-15px}
.item:focus-visible{outline-offset:-10px;border-radius:18px}
.art,.art2,.thumbnail,.flying{background-image:var(--sheet);background-size:500% 400%;background-repeat:no-repeat;background-position:var(--col) var(--row);filter:url(#clean)}
.art,.art2{position:absolute;inset:0;pointer-events:none}
.art2{opacity:0}
.dragging,.dragging *{cursor:grabbing!important}
.close{position:absolute;z-index:300;width:max(34px,calc(44 * var(--u)));aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:rgba(249,242,233,.7);display:grid;place-items:center;opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none;transition:opacity .25s,transform .4s,border-color .2s}
.close svg{width:36%;stroke-width:1.3}
.close:hover{border-color:var(--ink)}
.detail .close{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.panel{position:absolute;z-index:250;left:calc(905 * var(--u));top:calc(368 * var(--u));width:calc(400 * var(--u));opacity:0;transform:translateY(10px);visibility:hidden;transition:opacity .35s,transform .45s,visibility 0s .45s;touch-action:manipulation}
.detail .panel{opacity:1;transform:none;visibility:visible;transition:opacity .45s .13s,transform .45s .13s,visibility 0s}
.panel .caps{font-size:max(8px,calc(9.5 * var(--u)))}
.category{color:var(--muted)}
.panel h2{font-size:calc(34 * var(--u));font-weight:500;letter-spacing:-.025em;line-height:1.1;margin:calc(12 * var(--u)) 0 calc(14 * var(--u))}
.panel p{font-size:max(12px,calc(14 * var(--u)));line-height:1.6;max-width:30em;margin:0;color:var(--muted)}
.swatches{display:flex;gap:calc(12 * var(--u));margin:calc(26 * var(--u)) 0 calc(30 * var(--u))}
.swatch{width:max(18px,calc(24 * var(--u)));aspect-ratio:1;position:relative;border-radius:50%}
.swatch::after{content:"";position:absolute;inset:calc(-5 * var(--u));border:1px solid var(--ink);border-radius:50%;opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s}
.swatch[aria-checked=true]::after{opacity:.7;transform:scale(1)}
.add{border-bottom:1px solid var(--ink);padding-bottom:4px}
.hint,.dots{transition:opacity .35s,visibility .35s}
.detail .hint,.detail .dots{visibility:hidden;opacity:0}
.detail .shadow{opacity:.38}
.flying{position:fixed;z-index:700;pointer-events:none;transform-origin:center}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);max-width:100%;height:100%;max-height:100%;margin:0;padding:32px;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--ink);overflow:auto}
.drawer::backdrop{background:rgba(62,58,60,.16)}
.drawer header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:14px}
.drawer h2{font-size:26px;letter-spacing:-.04em;font-weight:500;margin:0}
.drawer header button{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;font-size:20px}
.row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border-bottom:1px solid var(--line);padding:12px 0}
.row .thumbnail{width:56px;height:56px;flex:none}
.row strong,.row small{display:block}
.row strong{font-size:16px;font-weight:500}
.row small,.drawer p{font-size:12px;color:var(--muted);line-height:1.6}
.row .tail{margin-left:auto}
.asset-error{position:absolute;top:60%;left:50%;transform:translateX(-50%);text-align:center;background:var(--bg);padding:10px;z-index:350;font-size:13px}
.asset-error button{text-decoration:underline}
@media (max-width:700px) and (orientation:portrait){
  .stage{width:100vw;height:100%;--piece:min(62vw,36vh)}
  .logo{left:20px;top:20px}.nav{right:20px;top:18px;gap:12px}
  .tagline{top:66px;font-size:8px}
  .series,.fabric{top:119px;font-size:8px;letter-spacing:.21em}.series{left:20px}.fabric{right:20px}
  .vertical{left:12px;top:50%;font-size:8px;letter-spacing:.16em}
  .ghost{top:calc(47% - 25vw);font-size:31vw}
  .shadow{left:13%;top:calc(47% + min(29vw,17vh));width:74%;height:3.8%;filter:blur(2px)}
  .dots{top:calc(47% + min(29vw,17vh) + 8%);gap:10px}
  .index{left:20px;bottom:24px}.index i{height:22px;margin:0 10px}
  .labels{min-width:10em;letter-spacing:.2em}
  .hint{left:auto;right:18px;bottom:28px;transform:none;gap:6px;letter-spacing:.16em}
  .panel{left:9%;top:51%;width:82%}
  .panel h2{font-size:clamp(21px,6vw,31px);margin:6px 0}
  .panel p{font-size:13px;line-height:1.45;max-width:32em}
  .swatches{gap:17px;margin:17px 0 16px}
  .swatch{width:23px}.swatch::after{inset:-4px}
  .detail .vertical,.detail .fabric,.detail .series,.detail .shadow{opacity:0}
}
@media(max-height:520px) and (orientation:landscape){
  .vertical{top:52%}.series,.fabric{top:17%}.index{bottom:14px}.hint{bottom:18px}
  .panel{top:31%;width:calc(470 * var(--u))}
}
@media(prefers-reduced-motion:reduce){
  *,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<svg class="filters" aria-hidden="true" focusable="false"><defs><filter id="clean" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA type="linear" slope="1.1" intercept="-0.1"/></feComponentTransfer></filter></defs></svg>
<header>
  <a class="chrome logo" href="./" aria-label="BUNTO home">BUNTO<sup>°</sup></a>
  <div class="chrome tagline caps">Soft things for small people<br>Ages 1–6</div>
  <nav class="chrome nav" aria-label="Shop">
    <a id="menu" class="caps" href="#collection" aria-haspopup="dialog">Menu</a>
    <button id="bag" class="round" aria-label="Bag, 0 items" aria-haspopup="dialog">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 5.5h9l-.7 8h-7.6zM5.8 5.5V4.4a2.2 2.2 0 0 1 4.4 0v1.1"/></svg><span id="badge" hidden></span>
    </button>
  </nav>
</header>
<div class="chrome series caps">The basics — 16 pieces</div>
<div class="chrome fabric caps">Organic cotton<br>Knit</div>
<div class="chrome vertical caps">Everyday essentials for little explorers</div>
<main class="stage" id="stage" aria-label="BUNTO kids’ basics">
  <h1 class="sr">BUNTO° — Kids’ basics collection</h1>
  <div class="ghost" aria-hidden="true">TINY</div><div class="shadow" aria-hidden="true"></div>
  <div id="ring" aria-label="Explore garments"></div>
  <div class="dots" aria-hidden="true"><i class="current"></i><i></i><i></i><i></i><i></i></div>
  <button class="close" id="close" aria-label="Close" hidden inert><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
  <section class="panel" aria-labelledby="title" inert>
    <div class="caps category" id="category"></div><h2 id="title"></h2><p id="description"></p>
    <div class="swatches" role="radiogroup" aria-label="Colour"></div><button class="caps add">Add to bag →</button>
  </section>
  <div class="asset-error" role="status" hidden>Product images couldn’t load. <button id="retry">Try again</button></div>
</main>
<div class="chrome index" aria-hidden="true"><div class="digits"><span>01</span></div><i></i><div class="labels caps"><span class="normal"><b style="font-weight:inherit" id="label">Romper</b><br>Collection</span><span class="alternate">Choose<br>A colour</span></div></div>
<button class="chrome hint caps" aria-label="Explore next garment"><svg viewBox="0 0 11 16" aria-hidden="true"><path d="M5.5 1v13M1.5 10l4 4 4-4"/></svg>Scroll to explore</button>
<dialog class="drawer" aria-labelledby="drawer-title"><header><h2 id="drawer-title"></h2><button aria-label="Close panel" autofocus>×</button></header><div id="drawer-content"></div></dialog>
<div class="sr" role="status" id="status"></div>
<script>
(() => {
  'use strict';
  const $ = selector => document.querySelector(selector);
  const stage = $('#stage'), ring = $('#ring'), panel = $('.panel'), close = $('#close');
  const drawer = $('.drawer'), bag = $('#bag'), badge = $('#badge');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const narrow = matchMedia('(max-width:700px) and (orientation:portrait)');
  const colours = ['Peach','Pink','Sage','Butter'];
  const palette = ['#FEDBDA','#FCB7CC','#C8C997','#F5B55A'];
  const catalogue = [
    {name:'Dungarees',title:'Cotton Dungarees',category:'Organic cotton',description:'A bib pocket for tiny treasures, easy straps and rolled cuffs for days spent exploring.'},
    {name:'Romper',title:'Knit Romper',category:'Organic cotton knit',description:'A soft, sleeveless knit with wooden shoulder buttons and plenty of room for little legs to move.'},
    {name:'Tee',title:'Pocket Tee',category:'Organic cotton',description:'Long sleeves, a relaxed fit and a little chest pocket. An everyday layer for cooler mornings.'},
    {name:'Cardigan',title:'Button Cardigan',category:'Organic cotton knit',description:'Chunky stitches and wooden buttons make this an easy layer to pull on when the afternoon cools.'},
    {name:'Bucket hat',title:'Bucket Hat',category:'Organic cotton',description:'A soft crown and a gently sloping brim, sized for little heads and long afternoons outside.'}
  ];
  const order = [[1,0],[2,1],[0,2],[3,3],[4,1],[3,2]];
  const entries = order.map(([col,row],i) => {
    const item = document.createElement('div');
    item.className='item'; item.tabIndex=0; item.setAttribute('role','button');
    item.setAttribute('aria-label',colours[row]+' '+catalogue[col].name);
    item.style.setProperty('--col',col*25+'%'); item.style.setProperty('--row',row*100/3+'%');
    item.innerHTML='<div class="art"></div><div class="art2"></div>';
    ring.append(item);
    return {i,col,row,item,overlay:item.lastElementChild,fade:null};
  });
  const radios = colours.map((colour,row) => {
    const button=document.createElement('button');button.className='swatch';button.type='button';
    button.setAttribute('role','radio');button.setAttribute('aria-label',colour);button.title=colour;
    button.style.background=palette[row];button.onclick=()=>choose(row);
    $('.swatches').append(button);return button;
  });
  const dots=[...document.querySelectorAll('.dots i')], step=Math.PI*2/entries.length;
  const lerp=(a,b,t)=>a+(b-a)*t, clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  let angle=0,velocity=0,selected=-1,mix=0,detailOpen=false,front=0,hover=-1,focusIndex=-1,displayed=0;
  let width,height,unit,piece,drag=null,ignoreClickUntil=0,pauseUntil=performance.now()+1200,last=0,dotIndex=-1;
  let cart=[];
  try{
    const stored=JSON.parse(sessionStorage.getItem('bunto-bag')||'[]');
    if(Array.isArray(stored))cart=stored.filter(v=>v && catalogue[v.col] && colours[v.row] && Number.isInteger(v.qty) && v.qty>0);
  }catch{}
  function measure(){
    width=stage.clientWidth;height=stage.clientHeight;unit=width/1440;piece=entries[0].item.offsetWidth;
    render();
  }
  function setIndex(i){
    if(i===displayed)return;
    displayed=i;
    const digits=$('.digits span');
    digits.textContent=String(i+1).padStart(2,'0');$('#label').textContent=catalogue[entries[i].col].name;
    if(!reduce.matches){digits.getAnimations().forEach(a=>a.cancel());digits.animate([{transform:'translateY(85%)'},{transform:'translateY(0)'}],{duration:260,easing:'ease-out'});}
  }
  function render(){
    if(!width)return;
    const mobile=narrow.matches;
    const curve=mix*mix*(3-2*mix);
    const ringX=width*.5, ringY=mobile?height*.47:436*unit;
    const targetX=mobile?width*.5:519*unit, targetY=mobile?height*.31:437*unit;
    const targetScale=mobile?Math.min(width*.62,height*.30)/piece:1.15;
    let nearest=-2;
    for(const e of entries){
      const a=angle+e.i*step, sine=Math.sin(a),cosine=Math.cos(a),depth=(1+cosine)/2;
      if(cosine>nearest){nearest=cosine;front=e.i;}
      let x=ringX+sine*(mobile?width*.359:478*unit)*(.84+.16*depth);
      let y=ringY+(1-depth)*(mobile?height*.10:120*unit);
      let scale=.355+.645*Math.pow(depth,1.68),tilt=sine*14,opacity=1;
      if(selected!==-1){
        if(e.i===selected){
          x=lerp(x,targetX,curve);y=lerp(y,targetY,curve);
          scale=lerp(scale,targetScale,curve);tilt*=1-curve;
        }else{
          const side=Math.abs(sine)<.02?(e.i%2?1:-1):Math.sign(sine);
          x+=side*width*.32*curve;y+=piece*.12*curve;scale*=1-.62*curve;opacity=1-curve;
        }
      }
      e.item.style.transform='translate3d('+x+'px,'+y+'px,0) rotate('+tilt+'deg) scale('+scale+')';
      e.item.style.zIndex=(selected===e.i && mix>.002)?210:Math.round(10+depth*100);
      e.item.style.opacity=opacity;
      if(e.i===selected){
        close.style.left=(x+piece*scale*.35)+'px';close.style.top=(y-piece*scale*.33)+'px';
      }
    }
    setIndex(detailOpen?selected:focusIndex>=0?focusIndex:hover>=0?hover:front);
    if(front%5!==dotIndex){
      dotIndex=front%5;dots.forEach((dot,i)=>dot.classList.toggle('current',i===dotIndex));
    }
  }
  function frame(now){
    const dt=last?Math.min((now-last)/1000,.06):0;last=now;
    const old=mix;
    mix=clamp(mix+(detailOpen?1:-1)*(reduce.matches?1000:1.65)*dt,0,1);
    if(!detailOpen && mix===0)selected=-1;
    const moving=!drag && selected===-1 && !drawer.open && focusIndex<0;
    if(moving){
      if(!reduce.matches && now>pauseUntil)angle+=dt*.15;
      angle+=dt*velocity;velocity*=Math.exp(-dt*3.4);
      if(Math.abs(velocity)<.002)velocity=0;
    }
    if(moving || mix!==old)render();
    requestAnimationFrame(frame);
  }
  function updateRadios(row){
    radios.forEach((button,i)=>{
      button.setAttribute('aria-checked',String(i===row));button.tabIndex=i===row?0:-1;
    });
  }
  function choose(row){
    if(!detailOpen)return;
    const e=entries[selected];
    if(e.row!==row){
      if(e.fade){e.fade.onfinish=null;e.fade.cancel();e.fade=null;}
      e.item.style.setProperty('--row',e.row*100/3+'%');
      e.overlay.style.setProperty('--row',row*100/3+'%');e.row=row;
      const commit=()=>{e.item.style.setProperty('--row',row*100/3+'%');e.fade=null;};
      if(reduce.matches)commit();
      else{e.fade=e.overlay.animate([{opacity:0},{opacity:1}],{duration:280,easing:'ease-out'});e.fade.onfinish=commit;}
      e.item.setAttribute('aria-label',colours[row]+' '+catalogue[e.col].name);
      $('#status').textContent=colours[row]+' '+catalogue[e.col].title+' selected.';
    }
    updateRadios(row);
  }
  $('.swatches').addEventListener('keydown',e=>{
    const directions={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};
    if(!(e.key in directions))return;e.preventDefault();
    const row=(entries[selected].row+directions[e.key]+4)%4;choose(row);radios[row].focus();
  });
  function openProduct(i){
    if(drawer.open)drawer.close();
    if(selected!==i)mix=0;
    selected=i;detailOpen=true;velocity=0;hover=focusIndex=-1;
    const e=entries[i],product=catalogue[e.col];
    $('#title').textContent=product.title;$('#category').textContent=product.category;
    $('#description').textContent=product.description;updateRadios(e.row);
    document.body.classList.add('detail');panel.inert=false;ring.inert=true;
    close.hidden=false;close.inert=false;render();close.focus({preventScroll:true});
  }
  function closeProduct(restore=true){
    if(!detailOpen)return;
    const index=selected;
    detailOpen=false;panel.inert=true;ring.inert=false;close.inert=true;
    document.body.classList.remove('detail');pauseUntil=performance.now()+850;
    if(restore)entries[index].item.focus({preventScroll:true});
  }
  close.onclick=()=>closeProduct();
  entries.forEach(({item,i})=>{
    item.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!drag&&!detailOpen){hover=i;render();}});
    item.addEventListener('pointerleave',()=>{if(hover===i){hover=-1;render();}});
    item.addEventListener('focus',()=>{focusIndex=item.matches(':focus-visible')?i:-1;render();});
    item.addEventListener('blur',()=>{focusIndex=-1;});
    item.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openProduct(i);}
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:-1)+entries.length)%entries.length;
        angle=-next*step;entries[next].item.focus();render();
      }
    });
    item.addEventListener('click',()=>{if(!detailOpen&&performance.now()>=ignoreClickUntil)openProduct(i);});
  });
  function nudge(direction){
    angle=(Math.round(angle/step)+direction)*step;velocity=0;hover=focusIndex=-1;
    pauseUntil=performance.now()+900;render();
  }
  $('.hint').onclick=()=>nudge(-1);
  ring.addEventListener('pointerdown',e=>{
    if(detailOpen||drawer.open||drag||e.button!==0)return;
    drag={id:e.pointerId,start:e.clientX,x:e.clientX,time:performance.now(),speed:0,moved:false};
    velocity=0;hover=focusIndex=-1;
  });
  window.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const now=performance.now();
    if(!drag.moved && Math.abs(e.clientX-drag.start)<5)return;
    if(!drag.moved){
      ring.setPointerCapture(e.pointerId);drag.moved=true;document.body.classList.add('dragging');
    }
    const delta=(e.clientX-drag.x)*Math.PI*2/(width*.98);
    const seconds=Math.max(.008,(now-drag.time)/1000);
    angle+=delta;drag.speed=lerp(drag.speed,clamp(delta/seconds,-9,9),.62);
    drag.x=e.clientX;drag.time=now;render();
  });
  function endDrag(e){
    if(!drag||e.pointerId!==drag.id)return;
    if(drag.moved){
      ignoreClickUntil=performance.now()+280;
      velocity=reduce.matches||e.type==='pointercancel'||performance.now()-drag.time>100?0:drag.speed;
    }
    drag=null;document.body.classList.remove('dragging');pauseUntil=performance.now()+450;
  }
  window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
  window.addEventListener('wheel',e=>{
    if(detailOpen||drawer.open||e.ctrlKey)return;
    e.preventDefault();const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    const factor=e.deltaMode===1?16:e.deltaMode===2?height:1;
    angle+=clamp(delta*factor,-180,180)*.0028;velocity=0;hover=focusIndex=-1;
    pauseUntil=performance.now()+420;render();
  },{passive:false});
  function updateBag(){
    const count=cart.reduce((sum,row)=>sum+row.qty,0);
    bag.setAttribute('aria-label','Bag, '+count+' '+(count===1?'item':'items'));
    badge.hidden=!count;badge.textContent=count;
  }
  function saveBag(){try{sessionStorage.setItem('bunto-bag',JSON.stringify(cart));}catch{}}
  function bounce(){
    if(!reduce.matches)bag.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:360});
  }
  function add(){
    if(!detailOpen)return;
    const e=entries[selected],line=cart.find(v=>v.col===e.col&&v.row===e.row);
    if(line)line.qty++;else cart.push({col:e.col,row:e.row,qty:1});
    saveBag();updateBag();$('#status').textContent=colours[e.row]+' '+catalogue[e.col].title+' added. '+bag.getAttribute('aria-label')+'.';
    if(reduce.matches)return;
    const rect=e.item.getBoundingClientRect(),target=bag.getBoundingClientRect();
    const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
    const dx=target.left+target.width/2-x,dy=target.top+target.height/2-y;
    const fly=document.createElement('div');fly.className='flying';fly.setAttribute('aria-hidden','true');
    fly.style.setProperty('--col',e.col*25+'%');fly.style.setProperty('--row',e.row*100/3+'%');
    Object.assign(fly.style,{width:rect.width+'px',height:rect.height+'px',left:rect.left+'px',top:rect.top+'px'});document.body.append(fly);
    const frames=Array.from({length:25},(_,i)=>{
      const t=i/24,arc=4*t*(1-t)*Math.min(innerHeight*.18,150);
      return {offset:t,transform:'translate('+dx*t+'px,'+(dy*t-arc)+'px) scale('+lerp(.73,.035,t)+')',opacity:t>.9?(1-t)*10:.92};
    });
    const anim=fly.animate(frames,{duration:730,easing:'cubic-bezier(.34,.04,.62,1)'});
    anim.onfinish=()=>{fly.remove();bounce();};anim.oncancel=()=>fly.remove();
  }
  $('.add').onclick=add;
  function showDrawer(isBag){
    $('#drawer-title').textContent=isBag?'Your bag':'The basics';
    const host=$('#drawer-content');host.replaceChildren();
    if(isBag&&!cart.length){const p=document.createElement('p');p.textContent='Your bag is empty.';host.append(p);}
    (isBag?cart:entries).forEach(line=>{
      const row=document.createElement(isBag?'div':'button');row.className='row';
      const thumb=document.createElement('span');thumb.className='thumbnail';thumb.setAttribute('aria-hidden','true');
      thumb.style.setProperty('--col',line.col*25+'%');thumb.style.setProperty('--row',line.row*100/3+'%');
      const copy=document.createElement('span'),name=document.createElement('strong'),tone=document.createElement('small');
      name.textContent=catalogue[line.col].title;tone.textContent=colours[line.row];copy.append(name,tone);
      const tail=document.createElement('span');tail.className='tail';tail.textContent=isBag?'× '+line.qty:'→';
      row.append(thumb,copy,tail);if(!isBag)row.onclick=()=>openProduct(line.i);host.append(row);
    });
    if(!drawer.open)drawer.showModal();
  }
  $('#menu').onclick=e=>{e.preventDefault();showDrawer(false);};bag.onclick=()=>showDrawer(true);
  $('.drawer header button').onclick=()=>drawer.close();
  drawer.addEventListener('click',e=>{if(e.target===drawer && e.clientX<drawer.getBoundingClientRect().left)drawer.close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.open&&detailOpen){e.preventDefault();closeProduct();}});
  $('.logo').onclick=e=>{
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    e.preventDefault();if(detailOpen)closeProduct(false);
    selected=-1;mix=0;angle=velocity=0;hover=focusIndex=-1;pauseUntil=performance.now()+1100;render();
  };
  // The two remote URLs refer to the same, unmodified 5-by-4 sprite sheet.
  const root=document.documentElement,primary=getComputedStyle(root).getPropertyValue('--sheet').trim().slice(4,-1).replace(/^["']|["']$/g,'');
  const original='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261113_115509_577e7e29-0e80-43e6-93ac-e6cf71972818.png';
  const assetError=$('.asset-error');
  function loadSheet(){
    let ready=false,backupStarted=false,failed=0;
    function fetchImage(url){
      const img=new Image();
      img.onload=()=>{if(!ready){ready=true;root.style.setProperty('--sheet','url("'+url+'")');assetError.hidden=true;}};
      img.onerror=()=>{failed++;if(failed===2&&!ready)assetError.hidden=false;else backup();};
      img.src=url;
    }
    function backup(){if(!ready&&!backupStarted){backupStarted=true;fetchImage(original);}}
    assetError.hidden=true;fetchImage(primary);setTimeout(backup,1600);
  }
  $('#retry').onclick=loadSheet;
  updateBag();measure();new ResizeObserver(measure).observe(stage);loadSheet();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
